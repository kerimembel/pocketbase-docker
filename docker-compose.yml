version: '3.9'
services:
  pocketbase:
    container_name: pocketbase
    build: .
    image: pocketbase:latest
    volumes:
      - pocketbase-volume:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketbase.rule=Host(`pocketbase.rimabel.cloud`) || Host(`pocketbase.rimabel.com`)"
      - "traefik.http.routers.pocketbase.entrypoints=websecure"
      - "traefik.http.routers.pocketbase.tls=true"
      - "traefik.http.routers.pocketbase.tls.certresolver=letsencrypt"
      - "traefik.http.services.pocketbase.loadbalancer.server.port=8090"
      - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public
    restart: unless-stopped

volumes:
  pocketbase-volume:
    name: pocketbase-volume

networks:
  traefik-public:
    external: true

